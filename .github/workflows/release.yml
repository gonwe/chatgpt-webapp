# GitHub Actions — 由 tauri-aur-scaffold 生成
#
# 用法:
#   1. 推送 tag:  git tag v0.1.0 && git push origin v0.1.0
#   2. 自动: 构建 Linux 二进制 → 打包 → 创建 GitHub Release → 推送 AUR
#
# 仓库 Secrets 配置:
#   AUR_SSH_KEY — AUR 账号的 SSH 私钥（登录 https://aur.archlinux.org 后
#                 ~/.ssh/authorized_keys 里添加的公钥对应的私钥）
#   生成: ssh-keygen -t ed25519 -C "aur" -f ~/.ssh/aur_ed25519
#         cat ~/.ssh/aur_ed25519.pub  → 添加到 AUR 账户
#         私钥内容 → GitHub Repo Settings → Secrets → AUR_SSH_KEY

name: Release

on:
  push:
    tags: ["v*"]

# softprops/action-gh-release 需要写 release 权限
permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev python3-pil

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      # dist/ 被 .gitignore 排除，不会进仓库；tauri build 需要它存在
      - name: Create frontend dist placeholder
        run: |
          mkdir -p dist
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Loading</title></head><body><p>Loading...</p></body></html>' > dist/index.html

      - name: Build release binary
        run: cargo tauri build --no-bundle

      - name: Package tar.gz (binary + wrapper + icons)
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          PKGNAME="chatgpt-webapp-desktop-bin"
          BINNAME="chatgpt-webapp-desktop"
          PKG_DIR="${PKGNAME}-${VER}-x86_64"
          mkdir -p "${PKG_DIR}"
          cp "src-tauri/target/release/${BINNAME}" "${PKG_DIR}/${BINNAME}.bin"
          cp "${BINNAME}.sh" "${PKG_DIR}/${BINNAME}"
          chmod +x "${PKG_DIR}/${BINNAME}" "${PKG_DIR}/${BINNAME}.bin"
          python3 - "${PKG_DIR}" "${BINNAME}" << 'PYEOF'
          import os, sys
          from PIL import Image
          out, binname = sys.argv[1], sys.argv[2]
          img = Image.open("src-tauri/icons/128x128.png")
          for size in (48, 64, 128, 256):
              d = f"{out}/{size}x{size}"
              os.makedirs(d, exist_ok=True)
              img.resize((size, size), Image.LANCZOS).save(f"{d}/{binname}.png")
          PYEOF
          tar czf "${PKG_DIR}.tar.gz" "${PKG_DIR}"
          echo "SHA256=$(sha256sum ${PKG_DIR}.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PKG_VER=${VER}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "chatgpt-webapp-desktop-bin-*.tar.gz"
          fail_on_unmatched_files: false

      - name: Upload PKGBUILD artifacts for AUR job
        uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: |
            PKGBUILD
            .SRCINFO
            chatgpt-webapp-desktop-bin.desktop

  aur:
    name: Publish to AUR
    needs: build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gonwe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: aur-package

      - name: Setup SSH for AUR
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_KEY }}

      - name: Update AUR package
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          PKGNAME="chatgpt-webapp-desktop-bin"
          # 直接下载刚发布的 asset 计算 sha256（比 job 间传递可靠）
          SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${PKGNAME}-${VER}-x86_64.tar.gz" | sha256sum | cut -d' ' -f1)

          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          git clone "ssh://aur@aur.archlinux.org/${PKGNAME}.git" aur-repo
          cd aur-repo

          cp ../aur-package/PKGBUILD ../aur-package/.SRCINFO ../aur-package/chatgpt-webapp-desktop-bin.desktop .

          # 更新版本
          sed -i "s/^pkgver=.*/pkgver=${VER}/" PKGBUILD
          sed -i "s/^pkgver = .*/pkgver = ${VER}/" .SRCINFO
          # 更新 tar.gz sha256（第一个 sha256sums 行）
          python3 - "${SHA}" << 'PYEOF'
          import sys
          sha = sys.argv[1]
          for f in ("PKGBUILD", ".SRCINFO"):
              lines = open(f).read().split("\n")
              for i, line in enumerate(lines):
                  if line.startswith("sha256sums=('SKIP'"):
                      lines[i] = line.replace("'SKIP'", f"'{sha}'", 1)
                      break
                  if line.startswith("sha256sums = SKIP"):
                      lines[i] = f"sha256sums = {sha}"
                      break
              open(f, "w").write("\n".join(lines) + "\n")
          PYEOF

          git config user.name "gonwe"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "v${VER}" || echo "无变更"
          git push
